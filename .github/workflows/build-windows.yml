name: Build Windows

permissions:
  contents: read
  pull-requests: read

on:
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string
        default: ""
        description: "Git ref to checkout (branch, tag, or SHA). Leaves empty for default."
  workflow_dispatch:

jobs:
  build-windows:
    name: ${{ matrix.game.id }} x86
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        game:
          - id: generalsxzh
            name: Zero Hour
            target: z_generals
            folder: GeneralsMD
            exe: GeneralsXZH.exe
            pdb: GeneralsXZH.pdb
            build_zh: "ON"
            build_generals: "OFF"
            artifact_name: generalsxzh-windows-x86
            ci_artifact_name: generalsxzh-windows-x86-replay-test-only
          - id: generalsx
            name: Generals Base
            target: g_generals
            folder: Generals
            exe: GeneralsX.exe
            pdb: GeneralsX.pdb
            build_zh: "OFF"
            build_generals: "ON"
            artifact_name: generalsx-windows-x86
            ci_artifact_name: generalsx-windows-x86-ci-only

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Restore vcpkg binary cache
        id: vcpkg_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-bincache-${{ runner.os }}-x86-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-x86-

      - name: Configure vcpkg cache directory
        shell: pwsh
        run: |
          $cacheDir = "${{ github.workspace }}/vcpkg-bincache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite" >> $env:GITHUB_ENV
          "VCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/triplets" >> $env:GITHUB_ENV
          "VCPKG_INSTALL_OPTIONS=--x-abi-tools-use-exact-versions" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        env:
          NGMP_DEFAULT_HOST: ${{ secrets.NGMP_DEFAULT_HOST }}
          NGMP_SERVER_HOST: ${{ secrets.NGMP_DEFAULT_HOST }}
          NGMP_SERVER_PORT: ${{ secrets.NGMP_SERVER_PORT }}
          NGMP_USE_SSL: ${{ secrets.NGMP_USE_SSL }}
          NGMP_WEB_PORTAL_URL: ${{ secrets.NGMP_WEB_PORTAL_URL }}
          NGMP_MOTD_URL: ${{ secrets.NGMP_MOTD_URL }}
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset win32-vcpkg `
            -DRTS_BUILD_GENERALS=${{ matrix.game.build_generals }} `
            -DRTS_BUILD_ZEROHOUR=${{ matrix.game.build_zh }} `
            -DRTS_BUILD_CORE_TOOLS=OFF `
            -DRTS_BUILD_ZEROHOUR_TOOLS=OFF `
            -DRTS_BUILD_GENERALS_TOOLS=OFF `
            -DRTS_BUILD_OPTION_SAGE_PATCH=OFF `
            -DSAGE_USE_DX8=ON `
            -DSAGE_USE_DETERMINISTIC_MATH=ON

      - name: Save vcpkg binary cache
        if: ${{ steps.vcpkg_cache.outputs.cache-hit != 'true' && matrix.game.id == 'generalsxzh' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: ${{ steps.vcpkg_cache.outputs.primary-key || format('vcpkg-bincache-{0}-x86-{1}', runner.os, hashFiles('vcpkg.json')) }}

      - name: Build
        shell: pwsh
        run: cmake --build --preset win32-vcpkg --target ${{ matrix.game.target }}

      - name: Collect runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          Copy-Item build/win32-vcpkg/${{ matrix.game.folder }}/Release/${{ matrix.game.exe }} artifacts/
          Copy-Item build/win32-vcpkg/${{ matrix.game.folder }}/Release/${{ matrix.game.pdb }} artifacts/
          Copy-Item build/win32-vcpkg/${{ matrix.game.folder }}/Release/${{ matrix.game.exe }} ci-artifacts/

          Get-ChildItem -Path @("vcpkg_installed/x86-windows/bin/*.dll", "build/win32-vcpkg/vcpkg_installed/x86-windows/bin/*.dll") -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Collecting vcpkg DLL: $($_.FullName)"
            Copy-Item $_.FullName artifacts/
            Copy-Item $_.FullName ci-artifacts/
          }

          # Collect Desktop Release CRT DLLs (msvcp140.dll, vcruntime140.dll, etc.)
          $vcReleaseDir = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Directory -Recurse |
            Where-Object { $_.FullName -match "\\x86\\" -and $_.FullName -match "Microsoft\.VC143\.CRT$" -and $_.FullName -notmatch "onecore" } |
            Select-Object -First 1

          if ($vcReleaseDir) {
            Get-ChildItem -Path (Join-Path $vcReleaseDir.FullName "*.dll") | ForEach-Object {
              Write-Host "Collecting Desktop Release CRT DLL: $($_.FullName)"
              Copy-Item $_.FullName artifacts/
              Copy-Item $_.FullName ci-artifacts/
            }
          }

          foreach ($name in @("binkw32.dll", "mss32.dll")) {
            $stub = Get-ChildItem build/win32-vcpkg -Filter $name -Recurse |
              Select-Object -First 1
            if ($null -eq $stub) {
              throw "Required CI stub not found: $name"
            }
            Copy-Item $stub.FullName ci-artifacts/
          }

          @"
          Copy these files into an existing licensed ${{ matrix.game.name }} installation.
          Keep the installation's original binkw32.dll and mss32.dll; the build-time
          stub DLLs do not provide retail video or audio playback.
          "@ | Set-Content artifacts/INSTALL.txt

      - name: Upload runtime
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.game.artifact_name }}
          path: artifacts
          retention-days: 7

      - name: Upload replay-test runtime
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.game.ci_artifact_name }}
          path: ci-artifacts
          retention-days: 1
