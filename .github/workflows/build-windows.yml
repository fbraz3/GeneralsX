name: Build Windows

permissions:
  contents: read
  pull-requests: read

on:
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string
        default: ""
        description: "Git ref to checkout (branch, tag, or SHA). Leaves empty for default."
  workflow_dispatch:

jobs:
  build-windows:
    name: ${{ matrix.game.id }} x64
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        game:
          - id: generalsxzh
            name: Zero Hour
            target: z_generals
            folder: GeneralsMD
            exe: GeneralsXZH.exe
            pdb: GeneralsXZH.pdb
            build_zh: "ON"
            build_generals: "OFF"
            artifact_name: windows-x64-GeneralsXZH.zip
            ci_artifact_name: windows-x64-GeneralsXZH-replay-test-only.zip
          - id: generalsx
            name: Generals Base
            target: g_generals
            folder: Generals
            exe: GeneralsX.exe
            pdb: GeneralsX.pdb
            build_zh: "OFF"
            build_generals: "ON"
            artifact_name: windows-x64-GeneralsX.zip
            ci_artifact_name: windows-x64-GeneralsX-ci-only.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve MSVC ABI cache key
        id: toolchain_id
        shell: pwsh
        run: |
          $vcVer = ($env:VCToolsVersion -replace '[^0-9A-Za-z._-]', '')
          $sdkVer = ($env:WindowsSDKVersion -replace '[^0-9A-Za-z._-]', '')
          if (-not $vcVer) { $vcVer = "unknown" }
          if (-not $sdkVer) { $sdkVer = "unknown" }
          $abi = "vc${vcVer}-sdk${sdkVer}"
          Write-Host "Resolved MSVC ABI key segment: $abi"
          "msvc_abi=$abi" >> $env:GITHUB_OUTPUT

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'ffc071e0c08432c60c9b64f00334c0227667931b'
          runVcpkgInstall: false
          doNotCache: true

      - name: Restore vcpkg binary cache
        id: vcpkg_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-bincache-v6-${{ runner.os }}-x64-${{ steps.toolchain_id.outputs.msvc_abi }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/ports/**', 'cmake/triplets/**', '.github/workflows/build-windows.yml') }}
          restore-keys: |
            vcpkg-bincache-v6-${{ runner.os }}-x64-${{ steps.toolchain_id.outputs.msvc_abi }}-

      - name: Configure vcpkg cache directory
        shell: pwsh
        run: |
          $cacheDir = "${{ github.workspace }}/vcpkg-bincache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite" >> $env:GITHUB_ENV
          "VCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/triplets" >> $env:GITHUB_ENV
          "VCPKG_OVERLAY_PORTS=${{ github.workspace }}/cmake/ports" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        env:
          NGMP_DEFAULT_HOST: ${{ secrets.NGMP_DEFAULT_HOST }}
          NGMP_SERVER_HOST: ${{ secrets.NGMP_DEFAULT_HOST }}
          NGMP_SERVER_PORT: ${{ secrets.NGMP_SERVER_PORT }}
          NGMP_USE_SSL: ${{ secrets.NGMP_USE_SSL }}
          NGMP_WEB_PORTAL_URL: ${{ secrets.NGMP_WEB_PORTAL_URL }}
          NGMP_MOTD_URL: ${{ secrets.NGMP_MOTD_URL }}
        run: |
          if (-not $env:VCPKG_ROOT) { $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT }
          cmake --preset win64 `
            -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/cmake/ports" `
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/cmake/triplets" `
            -DRTS_BUILD_GENERALS=${{ matrix.game.build_generals }} `
            -DRTS_BUILD_ZEROHOUR=${{ matrix.game.build_zh }} `
            -DRTS_BUILD_CORE_TOOLS=OFF `
            -DRTS_BUILD_ZEROHOUR_TOOLS=OFF `
            -DRTS_BUILD_GENERALS_TOOLS=OFF `
            -DRTS_BUILD_OPTION_SAGE_PATCH=OFF `
            -DSAGE_USE_DX8=ON

      - name: Save vcpkg binary cache
        if: ${{ steps.vcpkg_cache.outputs.cache-hit != 'true' && matrix.game.id == 'generalsxzh' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: ${{ steps.vcpkg_cache.outputs.cache-primary-key || format('vcpkg-bincache-v6-{0}-x64-{1}-{2}', runner.os, steps.toolchain_id.outputs.msvc_abi, hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/ports/**', 'cmake/triplets/**', '.github/workflows/build-windows.yml')) }}

      - name: Build
        shell: pwsh
        run: cmake --build build/win64 --config RelWithDebInfo --target ${{ matrix.game.target }}

      - name: Collect runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          Copy-Item build/win64/${{ matrix.game.folder }}/RelWithDebInfo/${{ matrix.game.exe }} artifacts/
          Copy-Item build/win64/${{ matrix.game.folder }}/RelWithDebInfo/${{ matrix.game.pdb }} artifacts/
          Copy-Item build/win64/${{ matrix.game.folder }}/RelWithDebInfo/${{ matrix.game.exe }} ci-artifacts/

          Get-ChildItem -Path @("vcpkg_installed/x64-windows/bin/*.dll", "build/win64/vcpkg_installed/x64-windows/bin/*.dll") -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Collecting vcpkg DLL: $($_.FullName)"
            Copy-Item $_.FullName artifacts/
            Copy-Item $_.FullName ci-artifacts/
          }

          if (Test-Path "assets/fonts") {
            if (-not (Test-Path "assets/fonts/LICENSE.liberation") -or -not (Test-Path "assets/fonts/LICENSE.fontawesome")) {
              throw "Missing required font license files in assets/fonts"
            }
            New-Item -ItemType Directory -Force artifacts/fonts | Out-Null
            Copy-Item assets/fonts/* artifacts/fonts/
            New-Item -ItemType Directory -Force ci-artifacts/fonts | Out-Null
            Copy-Item assets/fonts/* ci-artifacts/fonts/
          }

          if (Test-Path "build/win64/generalsx.big") {
            Copy-Item "build/win64/generalsx.big" artifacts/generalsx.big
            Copy-Item "build/win64/generalsx.big" ci-artifacts/generalsx.big
          }

          # Collect Desktop Release CRT DLLs (msvcp140.dll, vcruntime140.dll, etc.)
          $vcReleaseDir = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Directory -Recurse |
            Where-Object { $_.FullName -match "\\x64\\" -and $_.FullName -match "Microsoft\.VC143\.CRT$" -and $_.FullName -notmatch "onecore" } |
            Select-Object -First 1

          if ($vcReleaseDir) {
            Get-ChildItem -Path (Join-Path $vcReleaseDir.FullName "*.dll") | ForEach-Object {
              Write-Host "Collecting Desktop Release CRT DLL: $($_.FullName)"
              Copy-Item $_.FullName artifacts/
              Copy-Item $_.FullName ci-artifacts/
            }
          }

          # Fetch and verify official DXVK 2.6 x64 d3d8.dll + d3d9.dll for release bundle
          $pins = @{}
          Get-Content "scripts/build/windows/dxvk/dxvk-win64.pins" | ForEach-Object {
            $line = ($_ -replace '#.*$', '').Trim()
            if ($line -match '^([^=\s]+)\s*=\s*(.+)$') { $pins[$matches[1].Trim()] = $matches[2].Trim() }
          }
          $dxvkArchive = Join-Path $env:RUNNER_TEMP "dxvk-2.6.tar.gz"
          $dxvkExtract = Join-Path $env:RUNNER_TEMP "dxvk-2.6-extract"
          Invoke-WebRequest -Uri $pins["official_url"] -OutFile $dxvkArchive -UseBasicParsing
          New-Item -ItemType Directory -Force -Path $dxvkExtract | Out-Null
          tar -xzf $dxvkArchive -C $dxvkExtract
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract DXVK 2.6 tarball" }
          foreach ($pair in @(
            @{ Name = "d3d8.dll"; Hash = $pins["official_d3d8_sha256"].ToLowerInvariant() },
            @{ Name = "d3d9.dll"; Hash = $pins["official_d3d9_sha256"].ToLowerInvariant() }
          )) {
            $dllPath = Join-Path $dxvkExtract ("dxvk-2.6\x64\" + $pair.Name)
            $actual = (Get-FileHash -Path $dllPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $pair.Hash) {
              throw "DXVK $($pair.Name) SHA256 mismatch: expected $($pair.Hash), got $actual"
            }
            Copy-Item $dllPath (Join-Path "artifacts" $pair.Name)
          }

          @"
          Copy these files into an existing licensed ${{ matrix.game.name }} installation.
          GeneralsX Windows 64-bit uses MiniAudio and FFmpeg out of the box, bundles DXVK 2.6 x64
          (d3d8.dll/d3d9.dll), and falls back automatically to embedded d3d8to9 on systems without Vulkan 1.3.
          "@ | Set-Content artifacts/INSTALL.txt
          Compress-Archive -Path artifacts/* -DestinationPath "${{ matrix.game.artifact_name }}"
          Compress-Archive -Path ci-artifacts/* -DestinationPath "${{ matrix.game.ci_artifact_name }}"

      - name: Upload runtime
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.game.artifact_name }}
          path: ${{ matrix.game.artifact_name }}
          archive: false
          retention-days: 7

      - name: Upload replay-test runtime
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.game.ci_artifact_name }}
          path: ${{ matrix.game.ci_artifact_name }}
          archive: false
          retention-days: 1
