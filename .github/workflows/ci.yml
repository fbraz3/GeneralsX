name: GeneralsX CI

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-webrtc-tests:
    name: Native WebRTC transport (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # GeneralsX @build Copilot 30/08/2026 Compile libdatachannel integration and protocol tests on Linux.
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install native WebRTC dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates \
            libcurl4-openssl-dev libssl-dev

      - name: Configure native WebRTC transport
        run: |
          cmake \
            -S Core/Libraries/Source/Platform/NativeWebRTC \
            -B build/native-webrtc-linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=ON \
            -DSAGE_USE_DETERMINISTIC_MATH=ON

      - name: Build and test native WebRTC transport
        run: |
          cmake --build build/native-webrtc-linux \
            --target core_native_webrtc core_native_webrtc_tests \
              core_native_webrtc_profile_generals_game_math \
              core_native_webrtc_profile_zero_hour_platform_math
          ctest --test-dir build/native-webrtc-linux --output-on-failure

  native-webrtc-browser-interop:
    name: Native/browser WebRTC interop (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # GeneralsX @build Copilot 30/08/2026 Exercise the real macOS
      # libdatachannel transport against Chromium through a local Worker.
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install chromium

      - name: Configure native WebRTC probe
        run: |
          cmake \
            -S Core/Libraries/Source/Platform/NativeWebRTC \
            -B build/native-webrtc-browser \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=ON \
            -DSAGE_USE_DETERMINISTIC_MATH=ON

      - name: Build native WebRTC probe
        run: |
          cmake --build build/native-webrtc-browser \
            --target core_native_webrtc_tests core_native_webrtc_integration_probe \
              core_native_webrtc_profile_generals_game_math \
              core_native_webrtc_profile_zero_hour_platform_math
          ctest --test-dir build/native-webrtc-browser --output-on-failure

      - name: Direct ICE browser/native exchange
        run: scripts/qa/smoke/native-browser-webrtc-interop.sh direct build/native-webrtc-browser

      - name: Upload interop logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-browser-webrtc-interop
          path: logs/wasm-determinism/native-browser-direct/
          retention-days: 7
          if-no-files-found: ignore

  native-webrtc-turn-interop:
    name: Native/browser TURN interop (secret-gated)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    environment: turn-smoke
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Check required TURN secrets
        id: secret-check
        env:
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
        run: |
          if [ -n "$TURN_KEY_ID" ] && [ -n "$TURN_KEY_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TURN secrets are absent; skipping the relay-only native/browser interoperability probe."
          fi

      - name: Setup Node
        if: steps.secret-check.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: steps.secret-check.outputs.configured == 'true'
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.secret-check.outputs.configured == 'true'
        working-directory: web
        run: npx playwright install chromium

      - name: Configure and build native WebRTC probe
        if: steps.secret-check.outputs.configured == 'true'
        run: |
          cmake \
            -S Core/Libraries/Source/Platform/NativeWebRTC \
            -B build/native-webrtc-browser \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=ON \
            -DSAGE_USE_DETERMINISTIC_MATH=ON
          cmake --build build/native-webrtc-browser \
            --target core_native_webrtc_tests core_native_webrtc_integration_probe \
              core_native_webrtc_profile_generals_game_math \
              core_native_webrtc_profile_zero_hour_platform_math

      - name: Relay-only browser/native exchange
        if: steps.secret-check.outputs.configured == 'true'
        env:
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
        run: scripts/qa/smoke/native-browser-webrtc-interop.sh turn build/native-webrtc-browser

      - name: Upload TURN interop logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-browser-turn-interop
          path: logs/wasm-determinism/native-browser-turn/
          retention-days: 7
          if-no-files-found: ignore

  detect-changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      zh-should-build: ${{ steps.filter.outputs.zh-should-build }}
      base-should-build: ${{ steps.filter.outputs.base-should-build }}
      wasm-should-build: ${{ steps.filter.outputs.wasm-should-build }}
      web-should-build: ${{ steps.filter.outputs.web-should-build }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          token: ''
          filters: |
            zh-should-build:
              - 'GeneralsMD/**'
              - 'Core/**'
              - 'Dependencies/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - '.github/workflows/build-*.yml'
              - '.github/workflows/replay-tests*.yml'
              - '.github/workflows/ci.yml'
            base-should-build:
              - 'Generals/**'
              - 'Core/**'
              - 'Dependencies/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - '.github/workflows/build-*.yml'
              - '.github/workflows/replay-tests*.yml'
              - '.github/workflows/ci.yml'
            wasm-should-build:
              - 'GeneralsMD/**'
              - 'Core/**'
              - 'Dependencies/**'
              - 'wasm/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - '.github/workflows/build-wasm.yml'
              - '.github/workflows/ci.yml'
              - 'scripts/qa/verify-wasm-deterministic-math.py'
            web-should-build:
              - 'web/**'
              - '.github/workflows/build-web.yml'
              - '.github/workflows/ci.yml'

      - name: Build Trigger Summary
        run: |
          echo "### 🔍 CI Trigger (Granular)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.filter.outputs.zh-should-build }}" = "true" ]; then
            echo "| GeneralsX ZH (GeneralsMD) | ✅ Changes detected |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| GeneralsX ZH (GeneralsMD) | ⏭️ No changes |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.filter.outputs.base-should-build }}" = "true" ]; then
            echo "| GeneralsX Base (Generals) | ✅ Changes detected |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| GeneralsX Base (Generals) | ⏭️ No changes |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.filter.outputs.wasm-should-build }}" = "true" ]; then
            echo "| GeneralsX WebAssembly (browser port) | ✅ Changes detected |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| GeneralsX WebAssembly (browser port) | ⏭️ No changes |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.filter.outputs.web-should-build }}" = "true" ]; then
            echo "| GeneralsX Web (launcher/worker) | ✅ Changes detected |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| GeneralsX Web (launcher/worker) | ⏭️ No changes |" >> $GITHUB_STEP_SUMMARY
          fi

  build-linux-flatpak:
    name: Build Linux Flatpak
    needs: detect-changes
    if: needs.detect-changes.outputs.zh-should-build == 'true' || needs.detect-changes.outputs.base-should-build == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-linux-flatpak.yml
    with:
      preset: linux64-deploy
    secrets: inherit

  build-macos:
    name: Build macOS
    needs: detect-changes
    if: needs.detect-changes.outputs.zh-should-build == 'true' || needs.detect-changes.outputs.base-should-build == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-macos.yml
    with:
      preset: macos-vulkan
    secrets: inherit

  build-windows:
    name: Build Windows
    needs: detect-changes
    if: needs.detect-changes.outputs.zh-should-build == 'true' || needs.detect-changes.outputs.base-should-build == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  build-wasm:
    name: Build WebAssembly
    needs: detect-changes
    if: needs.detect-changes.outputs.wasm-should-build == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-wasm.yml
    secrets: inherit

  build-web:
    name: Build Web
    needs: detect-changes
    if: needs.detect-changes.outputs.web-should-build == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-web.yml
    secrets: inherit

  replay-test-linux:
    name: Replay Tests (linux)
    needs: [build-linux-flatpak]
    if: needs.build-linux-flatpak.result == 'success'
    uses: ./.github/workflows/replay-tests.yml
    with:
      platform: linux-flatpak
      game-artifact: linux-flatpak-generalsxzh-linux64-deploy
    secrets:
      ASSETS_KEY: ${{ secrets.ASSETS_KEY }}

  replay-test-macos:
    name: Replay Tests (macos)
    needs: [build-macos]
    if: needs.build-macos.result == 'success'
    uses: ./.github/workflows/replay-tests.yml
    with:
      platform: macos
      game-artifact: macos-generalsxzh-app
    secrets:
      ASSETS_KEY: ${{ secrets.ASSETS_KEY }}

  replay-test-windows:
    name: Replay Tests (windows)
    needs: [build-windows]
    if: needs.build-windows.result == 'success'
    uses: ./.github/workflows/replay-tests-windows.yml
    with:
      game-artifact: generalsxzh-windows-x86-replay-test-only
    secrets:
      ASSETS_KEY: ${{ secrets.ASSETS_KEY }}

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [native-webrtc-tests, native-webrtc-browser-interop, build-linux-flatpak, build-macos, build-windows, build-wasm, build-web, replay-test-linux, replay-test-macos, replay-test-windows]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "### GeneralsX Multi-Platform Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Native WebRTC (Linux) | ${{ needs.native-webrtc-tests.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Native/browser WebRTC direct ICE (macOS) | ${{ needs.native-webrtc-browser-interop.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux Flatpak | ${{ needs.build-linux-flatpak.result == 'success' && '✅ Success' || needs.build-linux-flatpak.result == 'skipped' && '⏭️ Skipped' || needs.build-linux-flatpak.result == 'cancelled' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS (arm64) | ${{ needs.build-macos.result == 'success' && '✅ Success' || needs.build-macos.result == 'skipped' && '⏭️ Skipped' || needs.build-macos.result == 'cancelled' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows (x86) | ${{ needs.build-windows.result == 'success' && '✅ Success' || needs.build-windows.result == 'skipped' && '⏭️ Skipped' || needs.build-windows.result == 'cancelled' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| WebAssembly (browser port, Emscripten) | ${{ needs.build-wasm.result == 'success' && '✅ Success' || needs.build-wasm.result == 'skipped' && '⏭️ Skipped' || needs.build-wasm.result == 'cancelled' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web (launcher/worker npm gate + fixture smoke) | ${{ needs.build-web.result == 'success' && '✅ Success' || needs.build-web.result == 'skipped' && '⏭️ Skipped' || needs.build-web.result == 'cancelled' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Replay Tests | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux ZH replays | ${{ needs.replay-test-linux.result == 'success' && '✅ Pass' || needs.replay-test-linux.result == 'skipped' && '⏭️ Skipped' || needs.replay-test-linux.result == 'cancelled' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS ZH replays | ${{ needs.replay-test-macos.result == 'success' && '✅ Pass' || needs.replay-test-macos.result == 'skipped' && '⏭️ Skipped' || needs.replay-test-macos.result == 'cancelled' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows ZH replays (Linux + macOS captures) | ${{ needs.replay-test-windows.result == 'success' && '✅ Pass' || needs.replay-test-windows.result == 'skipped' && '⏭️ Skipped' || needs.replay-test-windows.result == 'cancelled' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ℹ️ The macOS direct-ICE job exchanges real UDP-framed DataChannel traffic" >> $GITHUB_STEP_SUMMARY
          echo "> between libdatachannel and Chromium. Live TURN relay remains workflow-dispatch-only" >> $GITHUB_STEP_SUMMARY
          echo "> and secret-gated by the \`turn-smoke\` environment." >> $GITHUB_STEP_SUMMARY

      - name: Fail if Any Build or Replay Test Failed
        if: |
          needs.native-webrtc-tests.result == 'failure' ||
          needs.native-webrtc-browser-interop.result == 'failure' ||
          needs.build-linux-flatpak.result == 'failure' ||
          needs.build-macos.result == 'failure' ||
          needs.build-windows.result == 'failure' ||
          needs.build-wasm.result == 'failure' ||
          needs.build-web.result == 'failure' ||
          needs.replay-test-linux.result == 'failure' ||
          needs.replay-test-macos.result == 'failure' ||
          needs.replay-test-windows.result == 'failure'
        run: exit 1
