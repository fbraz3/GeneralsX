# Cloudflare Worker configuration for the GeneralsX room-signaling backend.
#
# This backend is independent of the retail game engine/assets: it only
# relays WebRTC signaling messages between players and issues short-lived
# TURN credentials. No game data is stored or proxied here.
name = "generalsx-signaling"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
# This file is the single source of truth for the Worker's non-secret vars, so
# a deploy replaces the live var set wholesale. Anything added by hand in the
# dashboard is intentionally removed on the next deploy rather than silently
# surviving as undeclared configuration. Secrets are a separate store and are
# never deleted by a deploy, so TURN_KEY_ID / TURN_KEY_API_TOKEN persist.
#
# This is about var *ownership* and says nothing about concurrent deploys.
# Neither does `wrangler deploy --strict`, which deploy-worker.sh also passes:
# strict mode refuses an upload when the live Worker's *settings* have drifted
# from this file (a dashboard edit), not when another operator is publishing a
# different script version at the same moment. There is no compare-and-swap on
# the deployed version in the Wrangler API. deploy-worker.sh narrows that
# window with an explicit precondition (GENERALSX_EXPECTED_RELEASE_ID) and CI
# serializes the workflow, but two operators deploying by hand at the same time
# is still last-write-wins — see packages/deploy/README.md.
keep_vars = false

# --- Custom domain -------------------------------------------------------
# Declared here (not attached by hand in the dashboard) so `wrangler deploy` is
# idempotent: it creates the custom domain and its proxied DNS record on first
# deploy and is a no-op afterwards. Keep the WebSocket signaling origin on its
# own subdomain, separate from the Pages domain, so the launcher's CSP
# `connect-src` allowlist stays narrow.
[[routes]]
pattern = "signaling.generalsx.org"
custom_domain = true

# --- Durable Objects: one instance per room, keyed by room id -------------
[[durable_objects.bindings]]
name = "ROOM_DO"
class_name = "RoomDurableObject"

# --- Durable Objects: one global TURN issuance ceiling ---------------------
# Deliberately a singleton (`idFromName("turn-edge-quota-v1")`). Room ids are
# attacker-chosen and rooms are free to create, so a room-keyed limit only
# bounds what one room costs. This object counts what an attacker cannot
# re-key — the edge-supplied client address, plus a deployment-wide ceiling —
# and every /turn-credentials request passes through it before any room is
# consulted. It holds no storage; see src/durable-objects/turn-quota-do.ts.
[[durable_objects.bindings]]
name = "TURN_QUOTA_DO"
class_name = "TurnQuotaDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TurnQuotaDurableObject"]

# --- R2: placeholder binding for authorized asset delivery ----------------
# The signaling worker itself never serves retail assets, and no asset bytes
# or manifests live in this repository. This binding is scaffolding for a
# *separately authorized* asset-delivery worker: the launcher's AssetManager
# downloads assets from `assetBaseUrl` in the manifest, never from this
# Worker.
#
# Whatever fronts the bucket must satisfy the launcher's delivery contract:
#   * `Accept-Ranges: bytes` and honest 206/416 handling — downloads are
#     streamed and resumed with `Range` + `If-Range`.
#   * Strong `ETag`s only (a `W/"…"` weak validator disables resume and is
#     rejected by manifest validation).
#   * `Cache-Control: public, max-age=31536000, immutable` — object keys are
#     content-addressed and manifests carry an `assetsRevision`, so a URL's
#     bytes never change.
#   * CORS for the launcher origin exposing `ETag`, `Content-Range`, and
#     `Content-Length` (`Access-Control-Expose-Headers`).
# R2 objects are immutable per key and emit strong ETags and range support by
# default; publish each revision under its own key prefix. Uncomment and
# point at a real bucket name once an authorized asset pipeline is deployed.
# [[r2_buckets]]
# binding = "ASSETS_BUCKET"
# bucket_name = "generalsx-web-assets"

# --- Environment variables (non-secret) -----------------------------------
[vars]
ALLOWED_ORIGINS = "https://play.generalsx.org"
SIGNALING_ORIGIN = "https://signaling.generalsx.org"
ASSET_ORIGIN = "https://assets.generalsx.org"
# Overwritten at deploy time with the commit SHA
# (`wrangler deploy --var RELEASE_ID:<sha>`, see
# ../../packages/deploy/scripts/deploy-worker.sh). `/healthz` and `/readyz`
# echo it back, so an operator can prove which immutable version is live after
# a `wrangler rollback`.
RELEASE_ID = "unknown"

# --- Secrets (set out of band, never committed) ---------------------------
# wrangler secret put TURN_KEY_ID
# wrangler secret put TURN_KEY_API_TOKEN
# Absent secrets are non-fatal: `/readyz` reports `degraded` and peers fall
# back to direct/STUN ICE, which the launcher surfaces as a visible warning.

# --- Health endpoints ------------------------------------------------------
#   GET https://signaling.generalsx.org/healthz  -> 200 liveness (no deps)
#   GET https://signaling.generalsx.org/readyz   -> 200 ready / 503 not ready
# Neither discloses a secret value; both send `Cache-Control: no-store`.

# --- Custom domain notes ---------------------------------------------------
# Production routing:
#   play.generalsx.org        -> Cloudflare Pages project (apps/launcher)
#   signaling.generalsx.org   -> this Worker (see [[routes]] above)
#   assets.generalsx.org      -> R2 bucket custom domain (authorized assets)
# Verify before publishing, then deploy and smoke test:
#   npm run build -w @generalsx-web/worker          # wrangler deploy --dry-run
#   packages/deploy/scripts/deploy-worker.sh
#   npm run smoke -w @generalsx-web/deploy
# Roll back to a previous immutable version with:
#   packages/deploy/scripts/rollback.sh worker <version-id>

[dev]
port = 8787
